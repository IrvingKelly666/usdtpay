<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/payment/assets/img/favicon.ico" type="image/x-icon">
    <title>{{ .title }}</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            background: #fff;
            color: #333;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .main {
            max-width: 560px;
            padding: 32px 20px;
        }

        h1 {
            font-size: 32px;
            font-weight: normal;
            margin: 0 0 24px;
        }

        p {
            font-size: 15px;
            line-height: 1.7;
            margin: 0 0 12px;
            color: #555;
        }

        hr {
            border: none;
            border-top: 1px solid #e5e5e5;
            margin: 24px 0;
        }

        .footer {
            font-size: 13px;
            color: #999;
        }
    </style>
</head>
<body>
<div class="main">
    <h1>{{ .title }}</h1>
    <p>If you see this page, the web service is successfully installed and working.</p>
    <p>Further configuration is required.</p>
    <hr>
    <p class="footer">Thank you for using {{ .title }}.</p>
</div>
</body>
</html>
