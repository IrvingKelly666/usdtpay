<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Payment</title>
    <link rel="stylesheet" href="/checkout/sage/assets/css/checkout.css">
    <script src="/checkout/sage/assets/js/jquery.min.js"></script>
    <script src="/checkout/sage/assets/js/jquery.qrcode.min.js"></script>
</head>
<body>
<main class="shell">
    <header class="topbar">
        <div class="brand">
            <span class="logo">CP</span>
            <span class="brand-name">Crypto Payment</span>
        </div>
        <span class="secure">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            安全支付
        </span>
    </header>

    <section class="hero">
        <p class="eyebrow">应付金额</p>
        <h1 class="amount" data-role="money">--</h1>
        <p class="item" data-role="order-name"></p>
        <div class="meta-line">
            <span>订单号 <b data-role="order-id">--</b></span>
            <span class="sep"></span>
            <a data-role="support" hidden>联系客服</a>
        </div>
    </section>

    <section class="panel" data-stage="select">
        <div class="field">
            <label for="currency">币种</label>
            <div class="select-wrap">
                <select id="currency" data-role="currency"></select>
                <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
            </div>
        </div>
        <div class="field">
            <label for="network">网络</label>
            <div class="select-wrap">
                <select id="network" data-role="network"></select>
                <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
            </div>
        </div>

        <div class="summary">
            <span>实付金额</span>
            <b data-role="preview"></b>
        </div>

        <button class="primary" data-role="pay" disabled>继续付款</button>
        <p class="timer-line">支付剩余时间 <b data-role="timer">--:--:--</b></p>
    </section>

    <section class="panel" data-stage="pay" hidden>
        <div class="pay-head">
            <div>
                <p class="eyebrow">支付金额</p>
                <div class="pay-amount-line">
                    <b data-role="pay-amount">--</b>
                    <em data-role="pay-currency"></em>
                </div>
                <p class="net-line">
                    <span data-role="pay-network"></span>
                    <span class="sep"></span>
                    <span>剩余 <b data-role="timer">--:--:--</b></span>
                </p>
            </div>
            <button class="copy" data-role="copy-amount" type="button">复制</button>
        </div>

        <div class="qr-panel">
            <div class="qr" data-role="qr"></div>
            <p>打开钱包扫码支付</p>
        </div>

        <div class="address-panel">
            <div class="address-label">
                <span>收款地址</span>
                <button class="copy" data-role="copy-address" type="button">复制</button>
            </div>
            <p data-role="pay-address">--</p>
        </div>

        <div class="details">
            <div><span>商户订单</span><b data-role="pay-order-id">--</b></div>
            <div><span>订单金额</span><b data-role="pay-money">--</b></div>
        </div>

        <p class="warning">请严格按上述金额转账，金额不符将无法自动到账。</p>
        <button class="ghost" data-role="reselect" type="button" hidden>重新选择支付方式</button>
    </section>

    <p class="notice" data-role="notice" hidden></p>

    <footer class="foot">
        <span>Crypto Payment</span>
        <span>加密支付 · 链上确认</span>
    </footer>
</main>

<div class="overlay" data-role="overlay" hidden>
    <div class="modal">
        <div class="modal-icon" aria-hidden="true">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"/>
            </svg>
        </div>
        <h2 data-role="overlay-title"></h2>
        <p data-role="overlay-text"></p>
        <a data-role="overlay-action" hidden>返回商户平台</a>
    </div>
</div>

<script src="/checkout/sage/assets/js/checkout.js"></script>
</body>
</html>
